spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: 8080

jwt:
  secret: testSecretKeyForNovelReaderApplicationThatIsLongEnoughForHS256Algorithm
  expiration: 86400000

crawler:
  user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  timeout: 30000
  ciweimao:
    enabled: false
  sf:
    enabled: false
  ciyuanji:
    enabled: false

logging:
  level:
    com.novelreader: INFO
